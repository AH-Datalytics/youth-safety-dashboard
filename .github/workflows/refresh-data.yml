name: Refresh Data

on:
  schedule:
    - cron: '0 12 * * *' # 7 AM EST / 12:00 UTC daily
  workflow_dispatch:

env:
  NODE_OPTIONS: --max-old-space-size=8192

# Anything else that rewrites the `data` branch must use this same group.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Dallas is ~20-25 min. Tarrant adds ~25-30 min: Fort Worth's ArcGIS layer
    # caps pages at 1,000 records and throttles concurrent requests, so ~576
    # pages is the floor for a full incidents pull. Raised from 60 when Tarrant
    # was added.
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Generated payloads live on the `data` branch, not master. Start from the current
      # set: an ETL that fails keeps its previous file, and that file must carry over
      # into the new data commit rather than drop out of it.
      - name: Fetch current data from the data branch
        run: node scripts/fetch-data.mjs --ref data

      - name: Download source files from OneDrive
        run: npx tsx scripts/download-sharepoint-files.ts
        env:
          SHAREPOINT_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
          SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_SOURCE_BASE_PATH: ${{ vars.SHAREPOINT_SOURCE_BASE_PATH }}
          SHAREPOINT_TJJD_FILE_PATH: ${{ vars.SHAREPOINT_TJJD_FILE_PATH }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Prepare data files (parallel)
        # Don't fail the whole job if the incidents parquet prep dies — the
        # incidents ETL falls back to the Socrata JSON API. But do surface it.
        run: |
          timed_run() {
            label="$1"
            shift
            start=$(date +%s)
            echo "[$label] starting at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            "$@"
            rc=$?
            end=$(date +%s)
            echo "[$label] finished in $((end - start))s with exit code $rc"
            return $rc
          }

          timed_run "prepare-incidents-parquet" python scripts/prepare-incidents-parquet.py & pid_inc=$!
          timed_run "prepare-cfs-csv" python scripts/prepare-cfs-csv.py & pid_cfs=$!
          rc=0
          wait $pid_inc || { echo "::warning::prepare-incidents-parquet.py failed; incidents ETL will fall back to Socrata JSON."; }
          wait $pid_cfs || { echo "::error::prepare-cfs-csv.py failed."; rc=1; }
          exit $rc

      - name: Run ETL pipelines
        run: npm run refresh-data

      # The generated payloads go to the `data` branch as one replacement commit (see
      # scripts/data-branch-paths.txt); master gets one small commit updating
      # data/data-ref.json, the pointer Vercel builds from. Both are pushed atomically,
      # with rebase-and-retry if master moved mid-run, and the master push is what
      # triggers the Vercel deploy.
      - name: Publish data and pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export DATA_COMMIT_MSG="chore: refresh data $(date -u +%Y-%m-%d)"
          bash scripts/data-branch.sh publish
